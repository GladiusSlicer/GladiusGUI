[package]
name = "GladiusGUI"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
egui = "0.29.1"


# Winit integration with egui
egui_winit_platform = "0.24.0"
# logging
env_logger = { version = "0.9", default-features = false, features = ["termcolor", "atty"] }
# Linear algebra library
glam = "0.29.2"

# Windowing
winit = "0.30.5"

native-dialog = "0.7.0"

egui_glium = "0.29.0"
glium = "0.36.0"

nom_stl = "0.2.2"

gladius_shared = { git = "https://github.com/mrhatman/GladiusSlicer", branch = "Gui-Updates"  }

serde_json = "1.0.74"
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
num_cpus = "1.13.1"

itertools = "0.13"


json-gettext = "4.0.0"

deser-hjson = "2.2"

egui_extras = { version = "0.29.1", features = ["all_loaders"] }
image = { version = "0.25", features = ["jpeg", "png"] } # Add the types you want support for